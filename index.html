<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WMS 교육용 플랫폼 로그인</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="logo-box">⌂</div>
    <h1 class="auth-title">WMS 교육용 플랫폼</h1>
    <p class="auth-desc">JSON 기반 데이터 저장 · GitHub Pages 배포용</p>
    <form id="loginForm" class="form-grid">
      <div class="form-row">
        <label for="email">이메일</label>
        <input id="email" type="email" value="admin@wms.com" required placeholder="이메일을 입력하세요">
      </div>
      <div class="form-row">
        <label for="password">비밀번호</label>
        <input id="password" type="password" value="1234" required placeholder="비밀번호를 입력하세요">
      </div>
      <button class="btn primary" type="submit">로그인</button>
    </form>
    <div class="auth-link">계정이 없으신가요? <a href="signup.html">회원가입</a></div>
  </main>
  <script src="js/app.js"></script>
  <script>initLogin();</script>
</body>
</html>
