<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WMS 교육용 플랫폼 회원가입</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="logo-box">▣</div>
    <h1 class="auth-title">회원가입</h1>
    <p class="auth-desc">교육용 계정을 생성합니다. 저장은 브라우저 localStorage에 반영됩니다.</p>
    <form id="signupForm" class="form-grid">
      <div class="form-row"><label for="name">이름</label><input id="name" required placeholder="이름을 입력하세요"></div>
      <div class="form-row"><label for="email">이메일</label><input id="email" type="email" required placeholder="이메일을 입력하세요"></div>
      <div class="form-row"><label for="password">비밀번호</label><input id="password" type="password" required placeholder="비밀번호를 입력하세요"></div>
      <div class="form-row"><label for="role">역할</label><select id="role"><option>관리자</option><option>창고담당자</option><option>입고담당자</option><option>출고담당자</option></select></div>
      <div class="form-row"><label for="department">부서</label><input id="department" required placeholder="부서를 입력하세요"></div>
      <button class="btn primary" type="submit">회원가입</button>
    </form>
    <div class="auth-link">이미 계정이 있으신가요? <a href="index.html">로그인</a></div>
  </main>
  <script src="js/app.js"></script>
  <script>initSignup();</script>
</body>
</html>
